[package]
name = "openrs-web"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
nix = { version = "0.31", features = ["user"] }
serde_json = { version = "1", features = ["raw_value"] }
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
