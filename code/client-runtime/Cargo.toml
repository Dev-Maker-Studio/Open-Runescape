[package]
name = "openrs-client-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openrs-protocol = { path = "../protocol" }
openrs-cs2 = { path = "../cs2" }
openrs-assets = { path = "../assets" }
openrs-login = { path = "../login" }
openrs-scene = { path = "../scene" }
openrs-entity = { path = "../entity-model" }
openrs-interface = { path = "../interface" }
openrs-interface-raster = { path = "../interface-raster" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["serde"] }
sha2 = { version = "=0.11.1", default-features = false }
crc32fast = "=1.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"

[dev-dependencies]
whirlpool = { version = "=0.11.0", default-features = false }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
