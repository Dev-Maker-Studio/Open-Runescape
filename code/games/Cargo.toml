[package]
name = "openrs-games"
version = "0.1.0"
edition = "2021"

[lib]
name = "games"
path = "src/lib.rs"

[[bin]]
name = "openrs-games"
path = "src/main.rs"

[dependencies]
renderer = { path = "../renderer", default-features = false }
bytemuck = "1"
tungstenite = "0.29"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
