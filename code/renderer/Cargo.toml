[package]
name = "renderer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "renderer-app"
path = "src/main.rs"
required-features = ["gpu"]

[[bin]]
name = "shaderc"
required-features = ["naga"]

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:png", "dep:winit"]
naga = ["dep:naga"]

[dependencies]
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc", "min_const_generics"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"], optional = true }
naga = { version = "30", features = ["glsl-in", "wgsl-out"], optional = true }
miniz_oxide = "0.9"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "parking_lot", "vulkan"], optional = true }
pollster = { version = "1", optional = true }
png = { version = "0.18", optional = true }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"], optional = true }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.iter]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
