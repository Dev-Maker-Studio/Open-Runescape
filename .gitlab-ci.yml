# Darkan client CI/CD
#
# Every push to `dev` and every `vX.Y.Z` tag builds the fully shadowed, runnable client jar
# (LWJGL natives for Linux, macOS and Windows bundled) and publishes it:
#
#   Latest dev build (overwritten on every push to dev):
#     https://gitlab.com/darkanrs/darkan-bot/-/jobs/artifacts/dev/raw/dist/darkan-client.jar?job=build
#     ${CI_API_V4_URL}/projects/<id>/packages/generic/darkan-client/dev-latest/darkan-client.jar
#
#   Latest official release (newest vX.Y.Z tag):
#     https://gitlab.com/darkanrs/darkan-bot/-/releases/permalink/latest
#     https://gitlab.com/darkanrs/darkan-bot/-/releases/permalink/latest/downloads/darkan-client.jar
#
#   A specific release: .../-/releases/vX.Y.Z  (asset darkan-client-X.Y.Z.jar)
#
# Cut a release with:  git tag v2.1.0 && git push origin v2.1.0

stages:
  - build
  - publish
  - release

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  PACKAGE_NAME: darkan-client
  PACKAGE_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/darkan-client"

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Resolve the build version once so every job agrees on names.
#   tag v2.1.0 -> 2.1.0
#   dev branch -> dev-<short sha>
.version: &version |
  if [ -n "$CI_COMMIT_TAG" ]; then VERSION="${CI_COMMIT_TAG#v}"; else VERSION="dev-$CI_COMMIT_SHORT_SHA"; fi
  echo "VERSION=$VERSION"

build:
  stage: build
  image: eclipse-temurin:17-jdk
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/caches
      - .gradle/wrapper
  script:
    - *version
    - ./gradlew --no-daemon --build-cache shadowJar -PreleaseVersion="$VERSION" -PallNatives=true
    - mkdir -p dist
    - cp "build/libs/darkan-client-shaded-$VERSION-all.jar" "dist/darkan-client-$VERSION.jar"
    - cp "dist/darkan-client-$VERSION.jar" dist/darkan-client.jar
    - echo "VERSION=$VERSION" > dist/build.env
    - ls -la dist
  artifacts:
    name: "darkan-client-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
    reports:
      dotenv: dist/build.env
    expire_in: 2 weeks

oracle:
  stage: build
  image: eclipse-temurin:17-jdk
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull
  variables:
    LAKAN_SCHEMA_REF: 23bda85c51b20691807bd0e19406eb14d2f40b67
  script:
    - ./gradlew --no-daemon --build-cache oracleJar
    - mkdir -p build/lakan-schema
    - curl -sSf "https://gitlab.com/api/v4/projects/darkanrs%2Flakan/repository/archive.tar.gz?sha=$LAKAN_SCHEMA_REF&path=tests/oracle-schema" | tar xz --strip-components=1 -C build/lakan-schema
    - sh src/oracle/verify.sh src/oracle/samples/computed.toml build/lakan-schema/tests/oracle-schema

# Rolling "latest dev build": the same package version is re-uploaded on every push to dev,
# so the URL below is a permalink to whatever last built green.
publish-dev:
  stage: publish
  image: curlimages/curl:latest
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/darkan-client.jar "$PACKAGE_URL/dev-latest/darkan-client.jar"'
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/darkan-client.jar "$PACKAGE_URL/dev-latest/darkan-client-$VERSION.jar"'
    - echo "Latest dev build -> $PACKAGE_URL/dev-latest/darkan-client.jar"

# Versioned release from a tag: upload to the package registry, then create a GitLab release
# whose asset links point at those files. GitLab's `permalink/latest` follows the newest
# release, giving a stable URL for the latest official build.
publish-release:
  stage: publish
  image: curlimages/curl:latest
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "dist/darkan-client-$VERSION.jar" "$PACKAGE_URL/$VERSION/darkan-client-$VERSION.jar"'
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/darkan-client.jar "$PACKAGE_URL/$VERSION/darkan-client.jar"'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build, publish-release]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Releasing $CI_COMMIT_TAG (version $VERSION)"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Darkan client $VERSION"
    description: |
      Runnable client jar with bundled natives for Linux, macOS and Windows.

      Run with `java -jar darkan-client-$VERSION.jar` (Java 17 or newer).
      Add `-Dbot.enabled=true` to show the bot sidebar.

      Built from commit $CI_COMMIT_SHORT_SHA.
    assets:
      links:
        - name: "darkan-client-$VERSION.jar"
          url: "$PACKAGE_URL/$VERSION/darkan-client-$VERSION.jar"
          filepath: "/darkan-client-$VERSION.jar"
          link_type: package
        - name: "darkan-client.jar (stable name)"
          url: "$PACKAGE_URL/$VERSION/darkan-client.jar"
          filepath: "/darkan-client.jar"
          link_type: package
