# Build JVM settings. The Kotlin compiler needs far more than Gradle's default 512 MB heap
# for this codebase; GitLab's shared runners (8 GB) failed with "Not enough memory to run
# compilation" until this was set. Compiling in-process keeps one JVM instead of two.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx3g
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
